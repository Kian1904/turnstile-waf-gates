<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tile Fixture</title>
<style>
  body { background: #222; color: #eee; font-family: sans-serif; margin: 20px; }
  h3 { margin: 8px 0; }
  .grid { display: grid; grid-template-columns: repeat(3, 110px); gap: 6px; width: max-content; }
  .tile { width: 110px; height: 110px; position: relative; border: 2px solid #555; }
  .tile.selected { border-color: #0f0; }
  .tile svg { width: 100%; height: 100%; display: block; }
  #status { margin-top: 12px; font-weight: bold; }
</style>
</head>
<body>
<h3 id="prompt">Pilih semua tile BERBAU (fish &amp; flower)</h3>
<div class="grid" id="grid"></div>
<div id="status">status: waiting</div>
<script>
// Deterministic tile set: index -> emoji rendered as SVG text (stable visual classes)
const TILES = ['fish','tree','car','flower','boat','fish','cloud','tree','flower'];
// Expected: all fish (0,5) and flower (3,8)
const EXPECTED = [0,5,3,8];
const grid = document.getElementById('grid');
const picked = new Set();
TILES.forEach((name, i) => {
  const d = document.createElement('div');
  d.className = 'tile';
  d.id = 'tile-' + i;
  d.dataset.name = name;
  const svg = '<svg xmlns="http://www.w3.org/2000/svg"><text x="50%" y="58%" font-size="64" text-anchor="middle" dominant-baseline="middle">' + (name==='fish'?'🐟':name==='flower'?'🌸':name==='tree'?'🌳':name==='car'?'🚗':name==='boat'?'⛵':'☁️') + '</text></svg>';
  d.innerHTML = svg;
  d.addEventListener('click', () => {
    if (picked.has(i)) { picked.delete(i); d.classList.remove('selected'); }
    else { picked.add(i); d.classList.add('selected'); }
    update();
  });
  grid.appendChild(d);
});
function update(){
  const arr = [...picked].sort();
  const ok = arr.length===EXPECTED.length && EXPECTED.every(v=>arr.includes(v));
  document.getElementById('status').textContent = 'status: ' + (ok ? 'PASS' : 'picked=' + JSON.stringify(arr));
  window.__fixture = {picked: arr, pass: ok};
}
window.__fixture = {picked: [], pass: false};
update();
</script>
</body>
</html>
